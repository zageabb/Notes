<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Notes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
    <div class="container">
        <h1 style="display:inline-block"><a href="{{ url_for('index') }}" style="color:white;text-decoration:none;">Notes</a></h1>
        {% block header_buttons %}{% endblock %}
    </div>
</header>
<div class="container">
    {% block content %}{% endblock %}
</div>
<footer>
    <div class="container">
        {% block footer %}{% endblock %}
    </div>
</footer>
</body>
</html>
