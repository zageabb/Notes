schema_version: 1
application:
  name: notes
  display_name: Notes
  group: TAIJU - Development
source:
  branch: main
runtime:
  type: python
  version: "3.10.12"
  working_dir: .
build:
  working_dir: .
  commands:
    - ["python", "-m", "pip", "install", "-r", "requirements.txt", "gunicorn"]
service:
  type: systemd
  entrypoint: ["gunicorn", "--workers", "1", "--timeout", "180", "--bind", "0.0.0.0:5063", "app:app"]
  port: 5063
  health_path: /
proxy:
  enabled: true
  path: /apps/notes/
  authentication: uda
environment:
  required: []
deployment:
  auto_update: true
  rollback: true
  github_reporting: false

