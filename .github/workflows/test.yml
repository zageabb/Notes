name: Notes tests

on:
  pull_request:
  push:
    branches:
      - notes-v2
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app.py notes_app tests
      - name: Run tests
        run: pytest
