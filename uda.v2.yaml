# V2 review candidate; no activation authority
schema_version: 2
application:
  name: notes
  kind: web
  display_name: "Notes"
  group: "TAIJU - Development"
source:
  branch: main
  repository: "zageabb/Notes"
builds:
  - name: build
    toolchain: python
    working_dir: "."
    commands:
      - ["python","-m","pip","install","-r","requirements.txt","gunicorn"]
services:
  - name: web
    role: web
    runtime: python
    runtime_version: "3.10.12"
    working_dir: "."
    entrypoint: ["gunicorn","--workers","1","--timeout","180","--bind","0.0.0.0:5063","app:app"]
    port: 5063
    health:
      type: http
      path: "/"
    restart: on-failure
    required_builds: [build]
proxy:
  enabled: true
  upstream: web
  canonical_path: /apps/notes/
  authentication: uda
environment:
  required: []
deployment:
  strategy: systemd
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
